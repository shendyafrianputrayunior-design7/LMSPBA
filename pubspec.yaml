name: lms_app
description: A UI-only Learning Management System (LMS) app built with Flutter fundamentals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ===============================================================
  # UI & IMAGE
  # ===============================================================

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3

  # ===============================================================
  # FIREBASE
  # ===============================================================

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  # ===============================================================
  # NETWORK & URL
  # ===============================================================

  http: ^1.6.0
  url_launcher: ^6.3.3

  # ===============================================================
  # VIDEO
  # ===============================================================

  video_player: ^2.10.1

  # ===============================================================
  # NOTIFICATIONS & REMINDER
  # ===============================================================

  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  timezone: ^0.11.1
  shared_preferences: ^2.5.3

  # ===============================================================
  # FILE PICKER
  # ===============================================================

  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

# ===============================================================
# FLUTTER
# ===============================================================

flutter:
  uses-material-design: true

  # =============================================================
  # ASSETS
  # =============================================================

  assets:
    - assets/images/

  # =============================================================
  # FONTS
  # =============================================================

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400

        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500

        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700

        - asset: assets/fonts/Inter_18pt-Italic.ttf
          style: italic

# ===============================================================
# FLUTTER LAUNCHER ICONS
# ===============================================================

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/images/logo-bgr.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo-bgr.png"